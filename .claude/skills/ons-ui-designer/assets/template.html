<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장비 점검 현황</title>
  <!-- 단일 파일 결과물이면 ons-base.css 내용을 <style>에 그대로 붙여 넣기 -->
  <link rel="stylesheet" href="ons-base.css">
</head>
<body>
  <header class="topbar">
    <span class="logo">SK ONS</span><span class="divider"></span>
    <h1 style="font-size:16px;color:inherit">장비 점검 현황</h1>
    <span class="aside">가나국사</span>
  </header>

  <main class="container">
    <section class="grid">
      <div class="card"><div class="label">총 점검</div><div class="display number">1,200 <span class="unit" style="font-size:16px">건</span></div><div class="muted">2026-07-01 ~ 2026-09-30</div></div>
      <div class="card"><div class="label">불량률</div><div class="display number">4.2 <span class="unit" style="font-size:16px">%</span></div><div class="muted">전 분기 대비</div></div>
    </section>

    <div class="table-wrap">
      <table>
        <thead><tr><th>장비</th><th>국사</th><th class="num">수신 레벨</th><th>점검일</th><th>상태</th></tr></thead>
        <tbody>
          <tr><td>RU-0001</td><td>가나국사</td><td class="num">-75 <span class="unit">dBm</span></td><td class="number">2026-09-01</td><td><span class="badge badge-success">정상</span></td></tr>
          <tr><td>RU-0002</td><td>가나국사</td><td class="num">-98 <span class="unit">dBm</span></td><td class="number">2026-09-02</td><td><span class="badge badge-error">장애</span></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
